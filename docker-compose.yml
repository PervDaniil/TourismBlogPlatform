version: '2.30.3'

services:
  db:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"

  backend:
    build: ./backend/app/
    volumes:
      - "./backend/app/:/app"
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  frontend:
    build: ./frontend/app/
    volumes:
      - "./frontend/app:/app"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "./backend/app/media:/app/media"
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend


volumes:
  mongo_data:
